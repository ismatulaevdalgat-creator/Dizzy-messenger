name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          rm -rf dizzy
          mkdir dizzy
          unzip -o Dizzy-Android-Fixed.zip -d dizzy
          find dizzy -maxdepth 3 -type f | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: dizzy
        run: |
          npm install --legacy-peer-deps

      - name: Install Expo dependencies
        working-directory: dizzy
        run: |
          npx expo install expo-font expo-constants expo-linking react-native-screens --legacy-peer-deps

      - name: Generate Android project
        working-directory: dizzy
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android --non-interactive

      - name: Build release APK
        working-directory: dizzy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "Checking APK..."
          find dizzy/android/app/build/outputs/apk/release -type f -name "*.apk" -print
          test -f dizzy/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: dizzy/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
