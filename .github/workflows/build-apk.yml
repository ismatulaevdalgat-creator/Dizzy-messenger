from pathlib import Path
workflow = r"""name: Build Dizzy APK
on: workflow_dispatch: push: branches: - main
jobs: build: runs-on: ubuntu-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20.19.1
      cache: ''

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Dizzy project ZIP
    shell: bash
    run: |
      set -e

      ZIP_FILE="Dizzy-final-ready.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: $ZIP_FILE not found in repository root."
        echo "Files in repository:"
        ls -la
        exit 1
      fi

      rm -rf project
      mkdir -p project

      unzip -q "$ZIP_FILE" -d project

      echo "Extracted project:"
      find project -maxdepth 3 -type f | sort

  - name: Find project root
    shell: bash
    run: |
      set -e

      PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/project" -type f -name package.json -print -quit)"

      if [ -z "$PROJECT_ROOT" ]; then
        echo "ERROR: package.json was not found inside Dizzy-final-ready.zip"
        exit 1
      fi

      PROJECT_ROOT="$(dirname "$PROJECT_ROOT")"

      echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      echo "Project root: $PROJECT_ROOT"

  - name: Verify project files
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      test -f package.json
      test -f app.json
      test -f babel.config.js

      echo "Project files:"
      ls -la

  - name: Fix Expo SDK 54 dependencies
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      node <<'NODE'
      const fs = require('fs');

      const file = 'package.json';
      const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

      pkg.dependencies = pkg.dependencies || {};

      pkg.dependencies["expo"] = "~54.0.27";
      pkg.dependencies["react"] = "19.1.0";
      pkg.dependencies["react-native"] = "0.81.5";
      pkg.dependencies["@expo/vector-icons"] = "^15.0.3";
      pkg.dependencies["expo-font"] = "~14.0.12";

      fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
      NODE

      echo "Final package.json:"
      cat package.json

  - name: Install npm dependencies
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      rm -rf node_modules
      rm -f package-lock.json npm-shrinkwrap.json yarn.lock

      npm install --legacy-peer-deps --no-audit --no-fund

  - name: Align Expo dependencies
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      npx expo install --fix --npm

  - name: Verify installed dependencies
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      echo "Node:"
      node --version

      echo "npm:"
      npm --version

      echo "Expo:"
      npx expo --version

      echo "Important packages:"
      npm list expo react react-native @expo/vector-icons expo-font expo-router --depth=0 || true

  - name: Check Expo project
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      npx expo-doctor

  - name: Generate Android project
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      rm -rf android

      npx expo prebuild \
        --platform android \
        --clean \
        --non-interactive

  - name: Build release APK
    working-directory: ${{ env.PROJECT_ROOT }}/android
    shell: bash
    run: |
      set -e

      chmod +x gradlew

      ./gradlew assembleRelease \
        --no-daemon \
        --stacktrace
