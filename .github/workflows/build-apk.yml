name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Dizzy
        run: |
          rm -rf dizzy
          unzip -o Dizzy-Android-Fixed.zip -d dizzy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: dizzy
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npx expo install --fix --npm
          npx expo install expo-font expo-constants expo-linking react-native-screens

      - name: Check Expo dependencies
        working-directory: dizzy
        run: |
          npx expo-doctor

      - name: Generate Android project
        working-directory: dizzy
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android --non-interactive

      - name: Build release APK
        working-directory: dizzy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: dizzy/android/app/build/outputs/apk/release/app-release.apk
 
