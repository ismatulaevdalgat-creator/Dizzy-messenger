name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Dizzy
        run: |
          unzip -o Dizzy-MVP.zip -d dizzy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: dizzy
        run: npm install

      - name: Generate Android project
        working-directory: dizzy
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: dizzy/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: dizzy/android/app/build/outputs/apk/release/app-release.apk
