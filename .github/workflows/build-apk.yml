name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dizzy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dizzy/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Install Expo peer dependencies
        run: |
          npm install \
            expo-font@~14.0.12 \
            expo-constants@~18.0.13 \
            expo-linking@~8.0.12 \
            react-native-screens@~4.16.0 \
            --legacy-peer-deps

      - name: Check Expo dependencies
        run: |
          npx expo-doctor

      - name: Generate Android project
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android

      - name: Build release APK
        working-directory: dizzy/android
        run: |
          chmod +x grad
