name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        run: |
          echo "Project files:"
          ls -la
          test -f package.json
          test -f app.json

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Check Expo
        run: |
          npx expo-doctor

      - name: Generate Android project
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "APK:"
          find android/app/build/outputs/apk/release -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
