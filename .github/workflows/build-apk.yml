name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f Dizzy-Final-Ready.zip
          echo "ZIP found:"
          ls -lh Dizzy-Final-Ready.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o Dizzy-Final-Ready.zip -d project

          echo "Extracted files:"
          find project -maxdepth 2 -type f | sort

      - name: Find project root
        run: |
          if [ -f project/package.json ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f project/dizzy/package.json ]; then
            echo "PROJECT_DIR=project/dizzy" >> "$GITHUB_ENV"
          else
            echo "ERROR: package.json was not found"
            find project -name package.json -print
            exit 1
          fi

      - name: Show project
        run: |
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/app.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show package versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Expo:"
          node -p "require('./package.json').dependencies.expo"
          echo "React:"
          node -p "require('./package.json').dependencies.react"
          echo "React Native:"
          node -p "require('./package.json').dependencies['react-native']"
          echo "Vector Icons:"
          node -p "require('./package.json').dependencies['@expo/vector-icons']"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --legacy-peer-deps

      - name: Check Expo
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx expo-doctor

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android --non-interactive

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-da
