name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: dizzy
        run: |
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Install Expo peer dependencies
        working-directory: dizzy
        run: |
          npx expo install expo-font expo-constants expo-linking react-native-screens

      - name: Check Expo dependencies
        working-directory: dizzy
        run: |
          npx expo-doctor

      - name: Generate Android project
        working-directory: dizzy
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android

      - name: Build release APK
        working-directory: dizzy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        working-directory: dizzy
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk/release -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: dizzy/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
