name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Dizzy project
        run: |
          rm -rf dizzy
          mkdir dizzy
          unzip -o Dizzy-Android-Fixed-Corrected.zip -d dizzy
          echo "Project files:"
          find dizzy -maxdepth 2 -type f | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check package.json
        working-directory: dizzy
        run: |
          echo "Expo:"
          node -p "require('./package.json').dependencies.expo"
          echo "React:"
          node -p "require('./package.json').dependencies.react"
          echo "React Native:"
          node -p "require('./package.json').dependencies['react-native']"
          echo "Vector Icons:"
          node -p "require('./package.json').dependencies['@expo/vector-icons']"

      - name: Install dependencies
        working-directory: dizzy
        run: |
          npm install --legacy-peer-deps

      - name: Install Expo dependencies
        working-directory: dizzy
        run: |
          npx expo install expo-font expo-constants expo-linking react-native-screens

      - name: Check Expo dependencies
        working-directory: dizzy
        run: |
          npx expo-doctor

      - name: Generate Android project
        working-directory: dizzy
        run: |
          rm -rf android
          npx expo prebuild --clean --platform android --non-interactive

      - name: Build release APK
        working-directory: dizzy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "Searching for APK..."
          find dizzy/android/app/build/outputs/apk/release -type f -name "*.apk" -print
          test -f dizzy/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-APK
          path: dizzy/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
