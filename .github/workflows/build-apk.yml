name: Build Dizzy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ""

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP="Dizzy-final-ready.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f -print | head -200

      - name: Locate Expo project
        id: locate_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find project -type f -name package.json \
            -not -path "*/node_modules/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside ZIP"
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Expo project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check package.json
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "package.json:"
          cat package.json

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid JSON')"

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          rm -f package-lock.json npm-shrinkwrap.json yarn.lock

          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Expo peer dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          npx expo install expo-font @expo/vector-icons

      - name: Check Expo dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          npx expo install --check

      - name: Generate Android project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Build release APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew
  - name: Check Expo project
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      npx expo-doctor

  - name: Generate Android project
    working-directory: ${{ env.PROJECT_ROOT }}
    shell: bash
    run: |
      set -e

      rm -rf android

      npx expo prebuild \
        --platform android \
        --clean \
        --non-interactive

  - name: Build release APK
    working-directory: ${{ env.PROJECT_ROOT }}/android
    shell: bash
    run: |
      set -e

      chmod +x gradlew

      ./gradlew assembleRelease \
        --no-daemon \
        --stacktrace
